<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zahlenmauer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/quiz.css">
<style>
  .mauer { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .reihe { display: flex; gap: 6px; }
  .stein { width: clamp(78px, 17vw, 120px); height: clamp(56px, 11vw, 76px); border-radius: 10px; display: flex; align-items: center; justify-content: center;
           font-size: clamp(28px, 6vw, 42px); font-weight: 700; background: color-mix(in srgb, #e5791f 22%, var(--card)); border: 3px solid color-mix(in srgb, #e5791f 55%, var(--card)); }
  .stein.frage { background: var(--card); border-style: dashed; border-color: var(--accent); }
  .stein .gap { border: 0; min-width: 1.4em; }
  .stein .gap.right { color: var(--good); }
  .regel { margin-top: 6px; }
</style>
</head>
<body>
<script src="../shared/konto.js"></script>
<script src="../shared/bestenliste.js"></script>
<script src="../shared/quiz.js"></script>
<script src="../shared/rechnen.js"></script>
<script>
(() => {
  const { rnd } = Rechnen;
  // Steine: 0 1 2 = unten, 3 4 = Mitte, 5 = oben. Jeder Stein ist die Summe der zwei darunter.
  function bauen(level) {
    for (let k = 0; k < 500; k++) {
      const max = level === "leicht" ? 50 : 100;
      const lo = level === "leicht" ? 1 : 3, hi = level === "leicht" ? 15 : 35;
      const a = rnd(lo, hi), b = rnd(lo, hi), c = rnd(lo, hi);
      const w = [a, b, c, a + b, b + c, a + 2 * b + c];
      if (w[5] > max || w[5] < 20) continue;
      return w;
    }
  }
  const gap = '<span class="gap" id="entry">?</span>';
  function mauer(w, miss, fill) {
    const st = (i) => i === miss ? `<div class="stein frage">${fill == null ? gap : `<span class="gap filled right">${fill}</span>`}</div>` : `<div class="stein">${w[i]}</div>`;
    return `<div class="mauer"><div class="reihe">${st(5)}</div><div class="reihe">${st(3)}${st(4)}</div><div class="reihe">${st(0)}${st(1)}${st(2)}</div></div>`;
  }
  // Wie rechnet man den fehlenden Stein aus?
  function rechnung(w, miss) {
    const S = (x, y, z) => `${x} + ${y} = <b>${z}</b>`, M = (x, y, z) => `${x} − ${y} = <b>${z}</b>`;
    switch (miss) {
      case 5: return `Oben: die zwei Steine darunter zusammenzählen: ${S(w[3], w[4], w[5])}`;
      case 3: return `Die zwei Steine darunter zusammenzählen: ${S(w[0], w[1], w[3])}`;
      case 4: return `Die zwei Steine darunter zusammenzählen: ${S(w[1], w[2], w[4])}`;
      case 0: return `Der Stein darüber ist ${w[3]}. Neben dir steht ${w[1]}: ${M(w[3], w[1], w[0])}`;
      case 2: return `Der Stein darüber ist ${w[4]}. Neben dir steht ${w[1]}: ${M(w[4], w[1], w[2])}`;
      case 1: return `Der Stein darüber links ist ${w[3]}, daneben unten steht ${w[0]}: ${M(w[3], w[0], w[1])}`;
    }
  }
  const MISS = { leicht: [3, 4, 5], mittel: [3, 4, 5, 0, 2], schwer: [0, 1, 2, 3, 4] };

  function makeTasks(level, topics, n) {
    const out = [];
    while (out.length < n) {
      const w = bauen(level);
      const miss = Quiz.pick(MISS[level]);
      out.push({
        key: w.join(",") + ":" + miss, input: true, answer: w[miss],
        prompt: miss >= 3 ? "Welche Zahl gehört in den leeren Stein?" : "Welche Zahl gehört in den leeren Stein? <b>Tipp: rechne minus!</b>",
        show: mauer(w, miss), solved: mauer(w, miss, w[miss]),
        tip: rechnung(w, miss),
        wrongWhy: (v) => miss < 3 && Number(v) > w[miss] + 5 ? "Unten ist die Zahl kleiner als der Stein darüber – rechne minus." : "",
        recap: `Mauer ${w[0]} · ${w[1]} · ${w[2]} → <span class="m">${w[miss]}</span>`
      });
    }
    return out;
  }

  Quiz.create({
    game: "zahlenmauer", back: "k2-mathe",
    title: "Zahlen<span>mauer</span> 🧱",
    heading: "Baue die Zahlenmauer fertig",
    intro: "In einer Zahlenmauer ist jeder Stein die <b>Summe der zwei Steine darunter</b>. Ein Stein ist leer – rechne aus, welche Zahl hineingehört. Fehlt unten ein Stein, musst du <b>minus</b> rechnen.",
    levels: [
      { id: "leicht", name: "Leicht", desc: "Bis 50 – oben und in der Mitte fehlt ein Stein." },
      { id: "mittel", name: "Mittel", desc: "Bis 100 – auch unten außen fehlt mal ein Stein." },
      { id: "schwer", name: "Schwer", desc: "Bis 100 – meistens fehlt ein Stein unten." }
    ],
    merk: `<p>Jeder Stein ist die <b>Summe</b> der zwei Steine darunter:</p>
      <p style="text-align:center; font-size:20px">
      <b>27</b><br>12 &nbsp; 15<br>5 &nbsp; 7 &nbsp; 8</p>
      <ul><li>5 + 7 = 12, 7 + 8 = 15, 12 + 15 = 27</li>
      <li>Fehlt ein Stein <b>oben</b> oder in der <b>Mitte</b>: die zwei Steine darunter <b>plus</b> rechnen.</li>
      <li>Fehlt ein Stein <b>unten</b>: den Stein darüber <b>minus</b> den Nachbarstein rechnen. 12 − 7 = 5.</li></ul>`,
    makeTasks,
    endTitles: ["Weiter üben!", "Gut gebaut!", "Super!", "Baumeister! 🧱"]
  });
})();
</script>
</body>
</html>
